[package]
name = "ai-game-translator-pro"
version = "2.0.0"
description = "Công cụ dịch game RPGMaker và Ren'Py bằng AI thông qua Proxy tùy chỉnh (Bản Rust Native)"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
